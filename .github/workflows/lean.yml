name: Lean verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      original_comparator:
        description: Run the pinned original OpenAI Comparator after native verification
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    needs: comparator-preflight
    if: always() && (needs.comparator-preflight.result == 'success' || needs.comparator-preflight.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ppac-yesmeta-migration
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: ppac-yesmeta-migration
      - name: Check out pinned L proof donor
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: EgoFakeFantasy/YesMetaZFC
          ref: 79793365c2145c53db37eaf8ab23a64826bd9738
          path: yesmetazfc-analytic-comprehension
      - name: Check out pinned OpenAI source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: openai-math-ppac-source
      - name: Install elan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/elan-v4.2.4-linux-x86_64.tar.gz"
          python3 scripts/ci_retry.py --output "$archive" -- \
            gh api repos/leanprover/elan/releases/assets/529114798 -H 'Accept: application/octet-stream'
          printf '%s  %s\n' '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63' "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Lean dependencies before source checks
        run: |
          python3 scripts/ci_retry.py -- elan toolchain install "$(cat lean-toolchain)"
          lake update
      - name: Check clean inputs and cross-platform source locks
        run: |
          python3 scripts/check_ci_inputs.py
          python3 -m unittest discover -s scripts -p test_ci_compatibility.py
          python3 -m unittest discover -s scripts -p test_original_comparator_guard.py
      - name: Build and audit
        run: python3 scripts/verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: verification
          path: |
            ppac-yesmeta-migration/verification/ci-inputs.json
            ppac-yesmeta-migration/verification/summary.json
            ppac-yesmeta-migration/verification/commands.json
            ppac-yesmeta-migration/verification/*.log
  comparator-preflight:
    name: Comparator Linux guard preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.original_comparator) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[original-comparator]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: migration
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: Zouuup/landrun
          ref: ec104f6edc1e14d7fec6d31146f1ec6f9c192c5a
          path: tools/landrun
          persist-credentials: false
      - name: Test fail-closed guard policy
        run: python3 -m unittest discover -s migration/scripts -p test_original_comparator_guard.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/landrun/go.mod
          cache-dependency-path: tools/landrun/go.sum
      - name: Build pinned real landrun
        run: cd tools/landrun && go build -trimpath -o landrun cmd/landrun/main.go
      - name: Check real guards before any long Lean build
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=NoNewPrivileges=true \
            --property=RestrictAddressFamilies= \
            --property=SystemCallErrorNumber=EPERM \
            --property=SystemCallArchitectures=native \
            '--property=SystemCallFilter=~@network-io io_uring_setup io_uring_enter io_uring_register' \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv=PATH="$PATH" --setenv=HOME="$HOME" \
            /usr/bin/python3 "$GITHUB_WORKSPACE/migration/scripts/original_comparator.py" guard \
            --landrun "$GITHUB_WORKSPACE/tools/landrun/landrun" \
            --output "$GITHUB_WORKSPACE/guard-verification"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: comparator-guard-preflight
          path: guard-verification/
  original-comparator:
    name: Original PPAC Comparator (Lean 4.34.1)
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.original_comparator) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[original-comparator]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.34.1
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: migration
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: original-source
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: leanprover/comparator
          ref: d03acab154d269c06e60e4de7e4cc85deebff94b
          path: tools/comparator
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: Zouuup/landrun
          ref: ec104f6edc1e14d7fec6d31146f1ec6f9c192c5a
          path: tools/landrun
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/landrun/go.mod
          cache-dependency-path: tools/landrun/go.sum
      - name: Install original Lean toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/elan-v4.2.4-linux-x86_64.tar.gz"
          python3 migration/scripts/ci_retry.py --output "$archive" -- \
            gh api repos/leanprover/elan/releases/assets/529114798 -H 'Accept: application/octet-stream'
          printf '%s  %s\n' '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63' "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          python3 migration/scripts/ci_retry.py -- "$HOME/.elan/bin/elan" toolchain install "$ELAN_TOOLCHAIN"
      - name: Build pinned real Comparator and sandbox tools
        run: |
          (cd tools/landrun && go build -trimpath -o landrun cmd/landrun/main.go)
          (cd tools/comparator && lake --wfail build lean4export comparator)
          test "$(git -C tools/comparator/.lake/packages/lean4export rev-parse HEAD)" = 076e8e57707e813375e8f9da8bf989799ace9680
      - name: Prepare unchanged original proof and trusted dependencies
        run: |
          python3 migration/scripts/original_comparator.py prepare --source original-source --project original-proof
          mkdir -p comparator-verification
          cp original-proof/comparator-inputs.json comparator-verification/
          (cd original-proof && lake update mathlib && lake exe cache get)
          test ! -d original-proof/.lake/build/lib/lean/OAI
      - name: Run original Comparator under verified real guards
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=NoNewPrivileges=true \
            --property=RestrictAddressFamilies= \
            --property=SystemCallErrorNumber=EPERM \
            --property=SystemCallArchitectures=native \
            '--property=SystemCallFilter=~@network-io io_uring_setup io_uring_enter io_uring_register' \
            --working-directory="$GITHUB_WORKSPACE/original-proof" \
            --setenv=PATH="$PATH" --setenv=HOME="$HOME" --setenv=LEAN_NUM_THREADS=1 \
            /usr/bin/python3 "$GITHUB_WORKSPACE/migration/scripts/original_comparator.py" run \
            --project "$GITHUB_WORKSPACE/original-proof" \
            --comparator "$GITHUB_WORKSPACE/tools/comparator/.lake/build/bin/comparator" \
            --landrun "$GITHUB_WORKSPACE/tools/landrun/landrun" \
            --exporter "$GITHUB_WORKSPACE/tools/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export" \
            --output "$GITHUB_WORKSPACE/comparator-verification"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: original-comparator
          path: comparator-verification/
